; BARTOS: CYD-2432S028 hardware with I2C LCD 16x2 display + 2 GPIO buttons.
; BTN_SCROLL = GPIO0 (next), BTN_SELECT = GPIO26 (select/back)
; LCD I2C: SDA=GPIO21, SCL=GPIO22, addr=0x27

[env:BARTOS]
board = CYD-2432S028
monitor_speed = 115200
board_build.partitions = custom_4Mb_full.csv
build_src_filter = ${env.build_src_filter} +<../boards/BARTOS>
build_flags =
	-DBARTOS_BOARD
    ${env.build_flags}
    -Iboards/BARTOS
    -Os

    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_ESP32_JTAG_SUPPORT_DISABLE=1

    ; Mark as CYD variant
    -DCYD=1

    ; LCD Logger (LcdLogger subclass, no serial VectorDisplay terminal needed)
    -DUSE_LCD_LOGGER=1

    ; Button pins
    -DBTN_SCROLL_PIN=0
    -DBTN_SELECT_PIN=26

    ; LCD I2C
    -DLCD_SDA_PIN=21
    -DLCD_SCL_PIN=22
    -DLCD_I2C_ADDR=0x27

    ; FM Radio
    -DFM_SI4713=1
    -DFM_RSTPIN=40

    ; Microphone (disabled)
    -DPIN_CLK=-1
    -DI2S_SCLK_PIN=-1
    -DI2S_DATA_PIN=-1
    -DPIN_DATA=-1

    ; RGB LED (disabled)
    -DRGB_LED=-1

    ; Speaker (disabled)
    -DBCLK=-1
    -DWCLK=-1
    -DDOUT=-1

    ; BadUSB
    -DBAD_TX=1
    -DBAD_RX=3

    ; SERIAL / GPS
    -DSERIAL_TX=1
    -DSERIAL_RX=3
    -DGPS_SERIAL_TX=SERIAL_TX
    -DGPS_SERIAL_RX=SERIAL_RX

    ; Buttons (managed by interface.cpp)
    -DHAS_BTN=0
    -DBTN_ALIAS='"Ok"'
    -DBTN_PIN=-1

    ; IR pins
    -DIR_TX_PINS='{{"Pin 4", 4}}'
    -DIR_RX_PINS='{{"Pin 35", 35}}'
    -DTXLED=4
    -DRXLED=35
    -DLED_ON=HIGH
    -DLED_OFF=LOW

    ; RF pins
    -DRF_TX_PINS='{{"Pin 4", 4}}'
    -DRF_RX_PINS='{{"Pin 35", 35}}'

    ; CC1101 SPI (disabled by default, wire manually if needed)
    -DUSE_CC1101_VIA_SPI
    -DCC1101_GDO0_PIN=4
    -DCC1101_SS_PIN=27
    -DCC1101_MOSI_PIN=SPI_MOSI_PIN
    -DCC1101_SCK_PIN=SPI_SCK_PIN
    -DCC1101_MISO_PIN=SPI_MISO_PIN

    ; NRF24 SPI
    -DUSE_NRF24_VIA_SPI
    -DNRF24_CE_PIN=4
    -DNRF24_SS_PIN=27
    -DNRF24_MOSI_PIN=SPI_MOSI_PIN
    -DNRF24_SCK_PIN=SPI_SCK_PIN
    -DNRF24_MISO_PIN=SPI_MISO_PIN

    ; W5500 SPI
    -DUSE_W5500_VIA_SPI
    -DW5500_SS_PIN=27
    -DW5500_MOSI_PIN=SPI_MOSI_PIN
    -DW5500_SCK_PIN=SPI_SCK_PIN
    -DW5500_MISO_PIN=SPI_MISO_PIN
    -DW5500_INT_PIN=4

    ; Font sizes
    -DFP=1
    -DFM=2
    -DFG=3

    ; ---- NO SCREEN / NO TOUCH -------------------------------------------
    -DROTATION=1
    -DBACKLIGHT=-1
    -DMINBRIGHT=160

    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DUSE_HSPI_PORT=1
    -DTFT_HEIGHT=320
    -DTFT_WIDTH=240
    -DTFT_MISO=-1
    -DTFT_MOSI=-1
    -DTFT_SCLK=-1
    -DTFT_CS=-1
    -DTFT_DC=-1
    -DTFT_RST=-1
    -DTFT_BL=-1
    -DTOUCH_CS=-1
    -DTFT_BACKLIGHT_ON=HIGH
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=16000000
    -DSPI_TOUCH_FREQUENCY=2500000

    -DTFT_BRIGHT_CHANNEL=0
    -DTFT_BRIGHT_Bits=8
    -DTFT_BRIGHT_FREQ=5000

    ; ---- SD Card --------------------------------------------------------
    -DSDCARD_CS=5
    -DSDCARD_SCK=18
    -DSDCARD_MISO=19
    -DSDCARD_MOSI=23

    ; ---- I2C / SPI ------------------------------------------------------
    -DGROVE_SDA=21
    -DGROVE_SCL=22
    -DSPI_SCK_PIN=18
    -DSPI_MOSI_PIN=23
    -DSPI_MISO_PIN=19
    -DSPI_SS_PIN=27

    -DDEVICE_NAME='"BARTOS"'

lib_deps =
    ${env.lib_deps}
    marcoschwartz/LiquidCrystal_I2C@^1.1.4

lib_ignore =
    FastLED
    ESP8266Audio
    ESP8266SAM
